<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHITBOT CORAL | LOJA</title>
    <link rel="icon" href="img/sclogo.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { black: '#0a0a0a', red: '#dc2626', gray: '#f4f4f5', darkgray: '#27272a' } },
                    animation: { 'slide-up': 'slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } } }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #lista { transition: opacity .28s ease, transform .28s ease; }
        #lista.saindo { opacity: 0; transform: translateY(-6px); }
        .card-produto { transition: transform .15s ease; }
        .card-produto:active { transform: scale(0.97); }
        .card-produto.fechado .cta { opacity: .45; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans antialiased text-brand-black">

<div class="bg-white w-full max-w-[414px] h-[90vh] max-h-[896px] rounded-[32px] shadow-2xl relative overflow-hidden flex flex-col">
    <div class="h-full flex flex-col animate-slide-up overflow-y-auto no-scrollbar">

        <header class="pt-8 pb-4 px-6 flex justify-center sticky top-0 bg-white/90 backdrop-blur-md z-10">
            <img src="img/logo.png" alt="Shitbot Coral" class="h-8 object-contain" onerror="this.src='https://placehold.co/120x40/0a0a0a/FFFFFF?text=SHITBOT'">
        </header>

        <main id="lista" class="px-6 pt-2 pb-8 flex-1">
            <div class="grid grid-cols-2 gap-3">

                <!-- ============ PIPICO — PRONTA ENTREGA ============ -->
                <a href="pipico.html" onclick="return abrir(event, this)" class="card-produto flex flex-col bg-brand-gray rounded-[20px] p-2.5">
                    <div class="relative bg-white rounded-xl aspect-[3/4] overflow-hidden mb-3">
                        <img src="img/2.png" alt="Camisa Pipico" class="w-full h-full object-contain p-1" onerror="this.src='https://placehold.co/300x400/ffffff/a1a1aa?text=Pipico'">
                        <span class="absolute top-2 left-2 bg-brand-black text-white text-[10px] font-bold px-2 py-1 rounded-full flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> Pronta entrega
                        </span>
                    </div>
                    <h2 class="text-[15px] font-bold uppercase tracking-wide text-brand-darkgray leading-tight min-h-[2.4em]">Camisa<br>Pipico</h2>
                    <p class="text-brand-red text-2xl font-black tracking-tight mt-auto pt-2 mb-3">R$ 99,90</p>
                    <div class="cta w-full bg-brand-black text-white font-bold text-sm text-center py-3 rounded-xl">Comprar agora</div>
                </a>

                <!-- ============ NAVIO PIRATA — PRÉ-VENDA ============ -->
                <a id="card-navio" href="navio-pirata.html" onclick="return abrir(event, this)" class="card-produto flex flex-col bg-brand-gray rounded-[20px] p-2.5">
                    <div class="relative bg-white rounded-xl aspect-[3/4] overflow-hidden mb-3">
                        <img data-img-base="img/naviopirata 1" alt="Camisa Navio Pirata do Arruda" class="w-full h-full object-contain p-1">
                        <span id="tag-navio" class="absolute top-2 left-2 bg-brand-red text-white text-[10px] font-bold px-2 py-1 rounded-full">Pré-venda</span>
                    </div>
                    <h2 class="text-[15px] font-bold uppercase tracking-wide text-brand-darkgray leading-tight min-h-[2.4em]">Navio Pirata<br>do Arruda</h2>
                    <p class="text-[11px] text-gray-500 font-medium leading-snug mt-1">Entrega: <span id="prazo-navio" class="font-bold text-gray-700">A definir</span></p>
                    <p id="preco-navio" class="text-brand-red text-2xl font-black tracking-tight mt-auto pt-2 mb-3">R$ 149,90</p>
                    <div id="cta-navio" class="cta w-full bg-brand-black text-white font-bold text-sm text-center py-3 rounded-xl">Garantir a minha</div>
                </a>

            </div>

        </main>
    </div>
</div>

<script src="config-prevenda.js"></script>
<script>
    const CFG = (typeof PREVENDA !== 'undefined') ? PREVENDA : { preco: 149.90, entregaPrevista: 'A definir', encerraEm: '' };

    // Preço, prazo e encerramento vêm de config-prevenda.js
    document.getElementById('preco-navio').innerText = CFG.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }).replace(/\s/g, ' ');
    document.getElementById('prazo-navio').innerText = CFG.entregaPrevista;

    const t = CFG.encerraEm ? new Date(CFG.encerraEm).getTime() : NaN;
    if (!isNaN(t) && Date.now() > t) {
        document.getElementById('tag-navio').innerText = 'Encerrada';
        document.getElementById('cta-navio').innerText = 'Encerrada';
        document.getElementById('card-navio').classList.add('fechado');
    }

    // Imagens (aceita png/jpg/webp, inclusive nome com espaço)
    const EXTS = ['png', 'jpg', 'jpeg', 'webp'];
    function carregarImg(el, base) {
        let i = 0;
        el.onerror = () => {
            i++;
            if (i < EXTS.length) el.src = encodeURI(`${base}.${EXTS[i]}`);
            else { el.onerror = null; el.src = 'https://placehold.co/300x400/e4e4e7/71717a?text=Foto'; }
        };
        el.src = encodeURI(`${base}.${EXTS[0]}`);
    }
    document.querySelectorAll('[data-img-base]').forEach(el => carregarImg(el, el.dataset.imgBase));

    // Saída suave da vitrine (a página do Navio Pirata abre branca e o preto sobe)
    function abrir(ev, a) {
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return true;
        ev.preventDefault();
        document.getElementById('lista').classList.add('saindo');
        setTimeout(() => { window.location.href = a.href; }, 260);
        return false;
    }
    // Voltando pelo botão "voltar" do navegador, a lista reaparece
    window.addEventListener('pageshow', e => { if (e.persisted) document.getElementById('lista').classList.remove('saindo'); });
</script>
</body>
</html>
