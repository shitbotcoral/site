<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loja | Shitbot Coral</title>
  <meta name="description" content="Loja oficial da Shitbot Coral. Camisas de pronta entrega e pré-venda, com pagamento por PIX ou cartão.">
  <meta name="theme-color" content="#08080B">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="Loja | Shitbot Coral">
  <meta property="og:description" content="Camisas de pronta entrega e pré-venda. PIX ou cartão.">
  <meta property="og:image" content="https://shitbotcoral.com.br/loja/produtos/navio-pirata/1.png">
  <!-- ?v=6.2 nos arquivos abaixo: quando mudar algum, troque o número para o celular não usar a versão velha guardada -->
  <link rel="icon" href="img/sclogo.png" type="image/png">
  <link rel="preload" href="fontes/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- adianta a conexão com a planilha (o estoque chega mais rápido) -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="css/loja.css?v=6.2">
</head>
<body data-tema="escuro">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo" id="topo">
    <div class="topo-pilula">
      <a class="marca" href="#/" aria-label="Shitbot Coral, ir para o início da loja">
        <img class="marca-logo" src="img/logo.png" alt="" width="120" height="36">
        <span class="marca-txt">Shitbot <b>Coral</b></span>
      </a>
      <nav class="topo-nav" aria-label="Principal">
        <a href="#/" class="topo-link" data-rota="vitrine" data-t="topo.loja">Loja</a>
        <a href="#/" class="topo-link" data-ir="colecao" data-t="topo.colecao">Coleção</a>
        <button type="button" class="sacola-btn" id="sacola-btn" aria-haspopup="dialog" aria-controls="sacola" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M5.5 8h13l-1.1 11.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8L5.5 8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="sacola-rot" data-t="topo.sacola">Sacola</span>
          <span class="sacola-qtd" id="sacola-qtd" aria-label="0 itens">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="conteudo" tabindex="-1"></main>

  <footer class="rodape">
    <div class="rodape-in">
      <div class="rodape-marca" aria-hidden="true">Shitbot<br>Coral</div>
      <div class="rodape-col">
        <p data-t="rodape.cidade">Recife, Pernambuco.</p>
        <p><span data-t="rodape.contato">Pedidos, trocas e dúvidas:</span> <a class="js-whats" href="#" data-t="rodape.whatsapp">WhatsApp da loja</a></p>
        <p><a class="js-insta" href="#" data-t="rodape.instagram">Instagram</a></p>
      </div>
    </div>
  </footer>

  <!-- Sacola: gaveta lateral no computador, folha de baixo no celular -->
  <div class="veu" id="veu" hidden></div>
  <div class="sacola" id="sacola" role="dialog" aria-modal="true" aria-labelledby="sacola-titulo" hidden>
    <div class="sacola-alca" aria-hidden="true"></div>
    <div class="sacola-topo">
      <h2 id="sacola-titulo" data-t="sacola.titulo">Sacola</h2>
      <button type="button" class="btn-icone" id="sacola-fechar" aria-label="Fechar sacola">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sacola-corpo" id="sacola-corpo"></div>
    <div class="sacola-pe" id="sacola-pe"></div>
  </div>

  <!-- Avisos: lidos pelo leitor de tela e mostrados na tela -->
  <div class="avisos" id="avisos" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="sem-js">A loja precisa do JavaScript ligado para funcionar. Se preferir, chame a gente no WhatsApp: (81) 99446-5372.</p></noscript>

  <script src="js/config.js?v=6.2"></script>
  <script src="js/textos.js?v=6.2"></script>
  <script src="js/produtos.js?v=6.2"></script>
  <script src="js/vendor/qrcode.js?v=6.2"></script>
  <script src="js/app.js?v=6.2"></script>
</body>
</html>
